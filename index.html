<!DOCTYPE html>
<html lang="es" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga Oficial Xuper APK</title>
    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración de Tailwind para soporte de modo oscuro y fuente Inter -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Fuente Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 selection:bg-indigo-500 selection:text-white">

    <!-- =====================================================================
         CONFIGURACIÓN DE ENLACES EXTERNOS DIRECTOS PARA CADA APK
         Reemplaza únicamente los valores de `urlDescarga` con tus enlaces
         directos de Google Drive, GitHub Releases, MediaFire o Dropbox.
    ====================================================================== -->
    <script>
        const ENLACE_XUPER_FIXED = "https://www.mediafire.com/file/jyzhokmt6qrw2er/Xuper.apk/file";
        const ENLACE_XUPER_ORIGINAL = "https://www.mediafire.com/file/x5yguxdcc859rvg/Xuper_fixed.apk/file";

        const ARCHIVOS_DISPONIBLES = [
            {
                id: "xuper-fixed",
                nombreArchivo: "Xuper_fixed.apk",
                urlDescarga: ENLACE_XUPER_FIXED,
                proveedor: "Enlace Directo",
                titulo: "Xuper (Versión Corregida)",
                etiqueta: "Versión Corregida • Recomendada",
                recomendado: true,
                descripcion: "Version beta",
                tamano: "35.7 MB (35,705 KB)",
                formato: "APK • Android"
            },
            {
                id: "xuper-original",
                nombreArchivo: "Xuper.apk",
                urlDescarga: ENLACE_XUPER_ORIGINAL,
                proveedor: "Enlace Directo",
                titulo: "Xuper (Versión Original)",
                etiqueta: "Versión Original • Estándar",
                recomendado: false,
                descripcion: "Verison Original",
                tamano: "35.7 MB",
                formato: "APK • Android"
            }
        ];
    </script>

    <!-- Barra Superior Minimalista -->
    <header class="w-full max-w-4xl mx-auto px-4 sm:px-6 pt-6 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                <!-- Ícono Android / APK -->
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17.523 15.3414C16.9673 15.3414 16.5152 14.8893 16.5152 14.3336C16.5152 13.7779 16.9673 13.3258 17.523 13.3258C18.0787 13.3258 18.5308 13.7779 18.5308 14.3336C18.5308 14.8893 18.0787 15.3414 17.523 15.3414ZM6.47704 15.3414C5.92134 15.3414 5.46924 14.8893 5.46924 14.3336C5.46924 13.7779 5.92134 13.3258 6.47704 13.3258C7.03274 13.3258 7.48484 13.7779 7.48484 14.3336C7.48484 14.8893 7.03274 15.3414 6.47704 15.3414ZM17.8845 9.2662L19.9038 5.7686C20.017 5.5726 19.9499 5.3219 19.7539 5.2087C19.5579 5.0955 19.3072 5.1626 19.194 5.3586L17.1494 8.9001C15.631 8.2072 13.8768 7.8182 12 7.8182C10.1232 7.8182 8.36904 8.2072 6.85064 8.9001L4.80604 5.3586C4.69284 5.1626 4.44214 5.0955 4.24614 5.2087C4.05014 5.3219 3.98304 5.5726 4.09624 5.7686L6.11554 9.2662C2.65104 11.1516 0.34082 14.7161 0.0361328 18.8864H23.9639C23.6592 14.7161 21.349 11.1516 17.8845 9.2662Z"/>
                </svg>
            </div>
            <span class="font-semibold text-sm tracking-tight text-slate-700 dark:text-slate-200">GABOLOG</span>
        </div>

        <!-- Botón de cambio de tema (Claro / Oscuro) -->
        <button id="themeToggle" type="button" aria-label="Cambiar tema"
            class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all shadow-sm">
            <!-- Ícono Sol (visible en modo oscuro) -->
            <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
            <!-- Ícono Luna (visible en modo claro) -->
            <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
        </button>
    </header>

    <!-- Contenido Principal: Selector de Versiones APK -->
    <main class="w-full max-w-3xl mx-auto px-4 sm:px-6 my-8 sm:my-10">
        <!-- Encabezado de la sección -->
        <div class="text-center mb-7">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-400 border border-emerald-200/70 dark:border-emerald-800/60 mb-3">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                DESCARGA COPIA COMPATIBLE
            </span>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                Descargar Xuper TV
            </h1>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-400 max-w-lg mx-auto">
                
            </p>
        </div>

        <!-- Banner de Notificación Global de Descarga (se muestra al pulsar cualquier botón) -->
        <div id="globalStatusBanner" class="hidden mb-6 rounded-2xl p-4 border bg-emerald-50/90 dark:bg-emerald-950/50 border-emerald-200 dark:border-emerald-800/70 text-emerald-950 dark:text-emerald-100 shadow-sm transition-all duration-300">
            <div class="flex items-start gap-3.5">
                <div id="bannerIcon" class="mt-0.5 shrink-0 text-emerald-600 dark:text-emerald-400">
                    <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                        <p id="bannerTitle" class="text-sm font-bold">Iniciando descarga...</p>
                        <button id="closeBannerBtn" type="button" aria-label="Cerrar aviso" class="text-xs opacity-60 hover:opacity-100 px-1.5 py-0.5 rounded">✕</button>
                    </div>
                    <p id="bannerMessage" class="text-xs mt-1 leading-relaxed opacity-90"></p>
                    <div class="mt-2.5 flex items-center gap-2 text-[11px] font-medium text-emerald-800 dark:text-emerald-300 bg-white/60 dark:bg-slate-900/50 px-3 py-1.5 rounded-xl border border-emerald-200/60 dark:border-emerald-800/50">
                        <svg class="w-4 h-4 shrink-0 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                        </svg>
                        <span>Recuerda habilitar <strong>"Instalar aplicaciones de orígenes desconocidos"</strong> en los ajustes de tu Android para completar la instalación.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenedor de las 2 Tarjetas de Descarga -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Las tarjetas se renderizan dinámicamente desde ARCHIVOS_DISPONIBLES -->
        </div>

        <!-- Sección Discreta / Colapsable: Guía para Configurar Enlaces Externos Directos -->
        <div class="mt-7">
            <details class="group bg-white/70 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl overflow-hidden transition-all">
                <summary class="flex items-center justify-between px-5 py-3.5 cursor-pointer select-none text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
                        

                
                    </div>
                </div>
            </details>
        </div>
    </main>

    <!-- Pie de página minimalista -->
    <footer class="w-full max-w-4xl mx-auto px-4 sm:px-6 pb-6 text-center text-xs text-slate-400 dark:text-slate-500">
        copyright @GABOLOG
    </footer>

    <!-- Lógica de Aplicación -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cardsGrid = document.getElementById('cardsGrid');
            const globalStatusBanner = document.getElementById('globalStatusBanner');
            const bannerTitle = document.getElementById('bannerTitle');
            const bannerMessage = document.getElementById('bannerMessage');
            const bannerIcon = document.getElementById('bannerIcon');
            const closeBannerBtn = document.getElementById('closeBannerBtn');

            let bannerTimeout = null;

            // 1. Renderizar dinámicamente ambas tarjetas APK con enlaces externos
            const renderCards = () => {
                cardsGrid.innerHTML = '';

                ARCHIVOS_DISPONIBLES.forEach((archivo) => {
                    const card = document.createElement('article');
                    
                    // Estilo destacado para la versión recomendada (Xuper_fixed.apk)
                    if (archivo.recomendado) {
                        card.className = 'relative flex flex-col justify-between bg-white dark:bg-slate-900 rounded-3xl p-6 border-2 border-emerald-500/80 dark:border-emerald-500/70 shadow-xl shadow-emerald-500/10 dark:shadow-none transition-all duration-200 hover:-translate-y-0.5';
                    } else {
                        card.className = 'relative flex flex-col justify-between bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200/90 dark:border-slate-800 shadow-lg shadow-slate-200/40 dark:shadow-none transition-all duration-200 hover:-translate-y-0.5';
                    }

                    const badgeClasses = archivo.recomendado
                        ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/90 dark:text-emerald-300 border-emerald-300/70 dark:border-emerald-700/70'
                        : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700';

                    const iconBgClasses = archivo.recomendado
                        ? 'bg-emerald-50 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 border-emerald-200/70 dark:border-emerald-800/60'
                        : 'bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 border-amber-200/70 dark:border-amber-800/60';

                    const buttonClasses = archivo.recomendado
                        ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-600/25 focus:ring-emerald-500/30'
                        : 'bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white shadow-md focus:ring-slate-500/30';

                    card.innerHTML = `
                        <div>
                            <!-- Etiqueta superior -->
                            <div class="flex items-center justify-between gap-2 mb-4">
                                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeClasses}">
                                    ${archivo.etiqueta}
                                </span>
                                <span class="text-xs font-mono font-medium text-slate-400 dark:text-slate-500">
                                    .APK
                                </span>
                            </div>

                            <!-- Ícono APK + Nombre del archivo -->
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 shrink-0 rounded-2xl border flex flex-col items-center justify-center ${iconBgClasses}">
                                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M17.523 15.3414C16.9673 15.3414 16.5152 14.8893 16.5152 14.3336C16.5152 13.7779 16.9673 13.3258 17.523 13.3258C18.0787 13.3258 18.5308 13.7779 18.5308 14.3336C18.5308 14.8893 18.0787 15.3414 17.523 15.3414ZM6.47704 15.3414C5.92134 15.3414 5.46924 14.8893 5.46924 14.3336C5.46924 13.7779 5.92134 13.3258 6.47704 13.3258C7.03274 13.3258 7.48484 13.7779 7.48484 14.3336C7.48484 14.8893 7.03274 15.3414 6.47704 15.3414ZM17.8845 9.2662L19.9038 5.7686C20.017 5.5726 19.9499 5.3219 19.7539 5.2087C19.5579 5.0955 19.3072 5.1626 19.194 5.3586L17.1494 8.9001C15.631 8.2072 13.8768 7.8182 12 7.8182C10.1232 7.8182 8.36904 8.2072 6.85064 8.9001L4.80604 5.3586C4.69284 5.1626 4.44214 5.0955 4.24614 5.2087C4.05014 5.3219 3.98304 5.5726 4.09624 5.7686L6.11554 9.2662C2.65104 11.1516 0.34082 14.7161 0.0361328 18.8864H23.9639C23.6592 14.7161 21.349 11.1516 17.8845 9.2662Z"/>
                                    </svg>
                                    <span class="text-[9px] font-extrabold tracking-wider mt-0.5">APK</span>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h2 class="text-lg font-bold text-slate-900 dark:text-white leading-snug">
                                        ${archivo.titulo}
                                    </h2>
                                    <p class="text-xs font-mono text-slate-500 dark:text-slate-400 truncate mt-0.5" title="${archivo.nombreArchivo}">
                                        ${archivo.nombreArchivo}
                                    </p>
                                </div>
                            </div>

                            <!-- Descripción -->
                            <p class="mt-4 text-xs sm:text-sm leading-relaxed text-slate-600 dark:text-slate-300">
                                ${archivo.descripcion}
                            </p>
                        </div>

                        <!-- Metadatos y Botón de Descarga Externa -->
                        <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800/80">
                            <div class="flex items-center justify-between text-xs mb-4">
                                <div>
                                    <span class="text-slate-400 dark:text-slate-500 block">Tamaño</span>
                                    <span class="font-semibold text-slate-800 dark:text-slate-200">${archivo.tamano}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-slate-400 dark:text-slate-500 block">Formato</span>
                                    <span class="font-semibold text-slate-800 dark:text-slate-200">${archivo.formato}</span>
                                </div>
                            </div>

                            <a href="${archivo.urlDescarga}"
                               target="_blank"
                               rel="noopener noreferrer"
                               data-filename="${archivo.nombreArchivo}"
                               data-url="${archivo.urlDescarga}"
                               class="apk-download-btn group w-full flex items-center justify-center gap-2.5 px-5 py-3.5 rounded-2xl font-semibold text-sm transition-all duration-200 active:scale-[0.98] focus:outline-none focus:ring-4 ${buttonClasses}">
                                <svg class="btn-icon w-5 h-5 transition-transform duration-200 group-hover:translate-y-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                <span class="btn-label">Descargar ${archivo.nombreArchivo}</span>
                            </a>
                        </div>
                    `;

                    cardsGrid.appendChild(card);
                });

                attachDownloadListeners();
            };

            // 2. Retroalimentación visual al pulsar cualquiera de los dos botones
            const attachDownloadListeners = () => {
                const buttons = document.querySelectorAll('.apk-download-btn');

                buttons.forEach((btn) => {
                    btn.addEventListener('click', (e) => {
                        const fileName = btn.getAttribute('data-filename');
                        const targetUrl = btn.getAttribute('data-url');
                        const labelEl = btn.querySelector('.btn-label');
                        const originalLabel = `Descargar ${fileName}`;

                        if (bannerTimeout) clearTimeout(bannerTimeout);

                        // Aviso amigable si aún no se ha reemplazado la URL de ejemplo
                        if (targetUrl.includes('tu-usuario/tu-repo')) {
                            e.preventDefault();
                            globalStatusBanner.classList.remove('hidden');
                            bannerIcon.innerHTML = `
                                <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                                </svg>
                            `;
                            bannerTitle.textContent = `Enlace de ejemplo detectado para ${fileName}`;
                            bannerMessage.textContent = `Abre el archivo index.html y reemplaza la variable ENLACE_XUPER_FIXED / ENLACE_XUPER_ORIGINAL con tu enlace real de Google Drive, MediaFire o GitHub Releases.`;
                            return;
                        }

                        // Cambiar texto temporalmente en el botón pulsado
                        labelEl.textContent = `Abriendo enlace de descarga...`;

                        // Mostrar banner de notificación superior
                        globalStatusBanner.classList.remove('hidden');
                        bannerIcon.innerHTML = `
                            <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                            </svg>
                        `;
                        bannerTitle.textContent = `Redirigiendo a la descarga de ${fileName}...`;
                        bannerMessage.textContent = `Se ha abierto el enlace directo externo para descargar "${fileName}". Si tu navegador bloquea ventanas emergentes, permite la descarga.`;

                        // Actualizar confirmación tras 1.4 segundos
                        bannerTimeout = setTimeout(() => {
                            labelEl.textContent = originalLabel;
                            bannerIcon.innerHTML = `
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            `;
                            bannerTitle.textContent = `¡Enlace de ${fileName} abierto!`;
                            bannerMessage.textContent = `Revisa la barra de notificaciones o la carpeta "Descargas" de tu dispositivo Android para instalar el APK.`;
                        }, 1400);
                    });
                });
            };

            closeBannerBtn.addEventListener('click', () => {
                globalStatusBanner.classList.add('hidden');
            });

            // 3. Gestión de Tema Claro / Oscuro
            const htmlEl = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');

            const applyTheme = (isDark) => {
                if (isDark) {
                    htmlEl.classList.add('dark');
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                } else {
                    htmlEl.classList.remove('dark');
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                }
            };

            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

            themeToggle.addEventListener('click', () => {
                const isNowDark = !htmlEl.classList.contains('dark');
                applyTheme(isNowDark);
                localStorage.setItem('theme', isNowDark ? 'dark' : 'light');
            });

            // Inicializar interfaz
            renderCards();
        });
    </script>
</body>
</html>
